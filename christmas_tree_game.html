.tree{position:absolute;left:27.3cqw;top:9cqh;height:82cqh;aspect-ratio:480/757;outline:none}
.tree>img.t{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 1.2cqh 1.2cqh rgba(60,20,0,.35))}
.orn{position:absolute;width:8.5cqh;height:8.5cqh;transform:translate(-50%,-50%);cursor:grab;filter:drop-shadow(0 .4cqh .4cqh rgba(0,0,0,.35));touch-action:none}
.orn img{width:100%;height:100%;pointer-events:none}
.top{position:absolute;left:50%;top:0;width:14cqh;height:14cqh;transform:translate(-50%,-62%);border:0;background:none;padding:0;cursor:pointer}
.top img{width:100%;height:100%;opacity:.35;filter:grayscale(1) brightness(1.6);transition:opacity .3s,filter .3s}
.top::before{content:"";position:absolute;inset:-60%;border-radius:50%;background:radial-gradient(rgba(255,226,140,.85),rgba(255,226,140,0) 65%);opacity:0;transition:opacity .4s}
.lit .top img{opacity:1;filter:drop-shadow(0 0 1.5cqh #ffd76a)}
.lit .top::before{opacity:1}
.top:not(.on) img{animation:pulse 1.6s ease-in-out infinite}
.panel{position:absolute;right:3cqw;top:5cqh;bottom:5cqh;width:29cqw;background:rgba(253,248,240,.94);border-radius:3cqh;box-shadow:0 1cqh 3cqh rgba(60,20,0,.35);padding:3cqh 2.4cqh;display:flex;flex-direction:column;gap:1.6cqh}
h1{margin:0;font-weight:400;font-size:5.4cqh;line-height:1.05;color:var(--red)}
.sub{display:flex;justify-content:space-between;align-items:baseline;gap:1cqh}
#hint{margin:0;font-size:2.5cqh;color:#7a4a2a;line-height:1.3;min-height:6.5cqh}
.count{white-space:nowrap;font-size:2.6cqh;color:var(--green)}
.count b{font-weight:400;font-size:4.4cqh;color:var(--red)}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4cqh;flex:1;min-height:0}
.item{font:inherit;font-size:2.3cqh;line-height:1.1;color:var(--ink);background:#fff;border:.4cqh solid #f0e1c8;border-radius:2cqh;display:flex;align-items:center;gap:1cqh;padding:.6cqh 1.2cqh;cursor:grab;touch-action:none;min-height:0}
.item img{height:7cqh;width:7cqh;object-fit:contain;pointer-events:none;flex:none}
.item.on{border-color:var(--gold);background:#fff4d6;box-shadow:0 0 0 .4cqh var(--gold)}
.ctls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2cqh}
.ctl{font:inherit;font-size:2.6cqh;min-height:7cqh;border-radius:1.6cqh;border:.35cqh solid #e8d4b6;background:#fff;color:var(--ink);cursor:pointer}
.ctl:disabled{opacity:.4}
.ctl:active,.item:active{transform:translateY(.3cqh)}
#done{grid-column:1/-1;min-height:9cqh;font-size:3.8cqh;background:var(--red);border-color:var(--gold);color:#fff}
.ghost{position:fixed;pointer-events:none;z-index:9;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.toast{position:absolute;left:41.9cqw;top:50cqh;transform:translate(-50%,-50%);background:#fff;color:var(--ink);font-size:3.2cqh;padding:1.4cqh 3cqh;border-radius:99px;box-shadow:0 1cqh 2cqh rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.banner{position:absolute;left:41.9cqw;bottom:2.5cqh;transform:translateX(-50%);background:var(--red);color:#ffe3a0;border:.5cqh solid var(--gold);font-size:6cqh;padding:.6cqh 4cqh;border-radius:99px;white-space:nowrap;display:none;box-shadow:0 1cqh 3cqh rgba(0,0,0,.35)}
.done .banner{display:block}
.snow{position:absolute;inset:0;pointer-events:none;display:none}
.done .snow{display:block}
.snow i{position:absolute;top:-3cqh;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite}
.done .orn{animation:tw 1.8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes fall{to{transform:translate(4cqw,110cqh)}}
@keyframes tw{50%{filter:drop-shadow(0 0 1.4cqh #ffe08a) brightness(1.15)}}
@keyframes pulse{50%{opacity:.6}}
.rotate{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:#7f1520;color:#fff;font-size:26px;padding:24px;line-height:1.5}
@media(orientation:portrait){.rotate{display:grid}}
@media(prefers-reduced-motion:reduce){.snow i,.done .orn,.top:not(.on) img{animation:none}}
</style>
</head>

timg.onload=()=>{try{const c=document.createElement('canvas');c.width=timg.naturalWidth;c.height=timg.naturalHeight;const x=c.getContext('2d');x.drawImage(timg,0,0);mask={w:c.width,h:c.height,d:x.getImageData(0,0,c.width,c.height).data}}catch(e){mask=null}};
const onTree=(fx,fy)=>{if(fy<.07||fy>.82||fx<0||fx>1)return false;if(!mask)return Math.abs(fx-.5)<fy*.55;const x=Math.round(fx*(mask.w-1)),y=Math.round(fy*(mask.h-1));return mask.d[(y*mask.w+x)*4+3]>110};
const rel=(cx,cy)=>{const r=tree.getBoundingClientRect();return[(cx-r.left)/r.width,(cy-r.top)/r.height]};

const SAMPLE=[['bauble',.42,.3],['bell',.6,.45],['cane',.36,.58],['snowflake',.55,.66],['gift',.66,.74]];
let S,undo=[],sel=null,sound=true,ac=null,drag=null,toastT;
function render(){
  orns.innerHTML=S.items.map((o,i)=>`<div class="orn" data-i="${i}" style="left:${(o.x*100).toFixed(2)}%;top:${(o.y*100).toFixed(2)}%;--d:${(i%6)*.3}s"><img src="${IMG[o.t]}" alt="${T[o.t][0]}"></div>`).join('');
  $('num').textContent=S.items.length;
  tree.classList.toggle('lit',S.star);$('top').classList.toggle('on',S.star);
  stage.classList.toggle('done',S.done);
  $('undo').disabled=!undo.length;
  $('done').textContent=S.done?'다시 꾸미기':'다 꾸몄어요!';
  for(const b of tray.children)b.classList.toggle('on',b.dataset.t===sel);
  $('hint').textContent=sel?`${T[sel][0]}${josa(T[sel][0])} 골랐어요. 트리를 눌러요!`:S.done?'멋진 트리가 완성됐어요!':S.star?'장식을 끌어다 트리에 달아요':'꼭대기 별을 눌러 불을 켜요';
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1300)}
function chime(f,d=0){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.75)}catch(e){}}
const save=()=>{undo.push(JSON.stringify(S.items));if(undo.length>60)undo.shift()};
function place(t,fx,fy){if(!onTree(fx,fy)){toast('초록 나뭇가지 위에 놓아요');return}save();S.items.push({t,x:+fx.toFixed(4),y:+fy.toFixed(4)});chime(T[t][1]);render()}

function start(d,e){e.preventDefault();drag={...d,x0:e.clientX,y0:e.clientY,moved:false}}
addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<10)return;
  if(!drag.moved){drag.moved=true;
    if(drag.kind==='new'){const g=document.createElement('img');g.src=IMG[drag.t];g.className='ghost';const s=tree.getBoundingClientRect().height*.11;g.style.width=g.style.height=s+'px';document.body.append(g);drag.ghost=g}
    else save()}
  if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}
  else{const[fx,fy]=rel(e.clientX,e.clientY),el=orns.children[drag.i];if(el){el.style.left=fx*100+'%';el.style.top=fy*100+'%'}}
});
addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;if(d.ghost)d.ghost.remove();
  const[fx,fy]=rel(e.clientX,e.clientY);
  if(d.kind==='new'){if(d.moved)place(d.t,fx,fy);else{sel=sel===d.t?null:d.t;if(sel)chime(T[sel][1]);render()}}
  else if(d.moved){if(onTree(fx,fy)){S.items[d.i].x=+fx.toFixed(4);S.items[d.i].y=+fy.toFixed(4);chime(T[S.items[d.i].t][1])}else{S.items.splice(d.i,1);toast('장식을 뺐어요')}render()}
  else if(sel)place(sel,fx,fy);
});
addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;render()});
tray.addEventListener('pointerdown',e=>{const b=e.target.closest('.item');if(b)start({kind:'new',t:b.dataset.t},e)});
tray.addEventListener('keydown',e=>{const b=e.target.closest('.item');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sel=b.dataset.t;render()}});
tree.addEventListener('pointerdown',e=>{
  if(e.target.closest('#top'))return;
  const o=e.target.closest('.orn');if(o){start({kind:'move',i:+o.dataset.i},e);return}
  if(sel){const[fx,fy]=rel(e.clientX,e.clientY);place(sel,fx,fy)}
});
$('top').addEventListener('click',()=>{S.star=!S.star;if(S.star){chime(784);chime(1047,.12);chime(1319,.24)}render()});
$('undo').onclick=()=>{if(!undo.length)return;S.items=JSON.parse(undo.pop());render()};
$('clear').onclick=()=>{if(!S.items.length&&!S.star)return;save();S.items=[];S.star=false;S.done=false;sel=null;render();toast('새로 꾸며 봐요')};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'소리 켬':'소리 끔';$('snd').setAttribute('aria-pressed',sound)};
$('done').onclick=()=>{S.done=!S.done;if(S.done){S.star=true;sel=null;[523,659,784,1047].forEach((f,i)=>chime(f,i*.15))}render()};

const ok=o=>o&&T[o.t]&&isFinite(o.x)&&isFinite(o.y);
function boot(d){
  const items=Array.isArray(d&&d.items)?d.items.filter(ok).map(o=>({t:o.t,x:+o.x,y:+o.y})):SAMPLE.map(([t,x,y])=>({t,x,y}));
  S={items,star:!!(d&&d.star),done:!!(d&&d.done)};render();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
